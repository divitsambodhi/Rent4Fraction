# docker-compose.yml — MySQL 8.4 + Adminer for local development
# Port defaults: MySQL 3306, Adminer 8080.
# To avoid port conflicts, set MYSQL_PORT=3307 and/or ADMINER_PORT=8081 in .env.

services:
  mysql:
    image: mysql:8.4
    container_name: event_rental_mysql
    restart: unless-stopped
    # Allow non-deterministic stored functions when binary log is on
    command: >
      --log-bin-trust-function-creators=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "--host=localhost",
          "--user=root",
          "--password=${MYSQL_ROOT_PASSWORD}",
          "--silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  adminer:
    image: adminer:latest
    container_name: event_rental_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  # Named volume — MySQL data lives in Docker''s volume store, not in the repo.
  mysql_data:
    name: event_rental_mysql_data
