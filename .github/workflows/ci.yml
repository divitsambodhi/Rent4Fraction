name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client:
    name: Client Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build client bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder-key
          VITE_FIREBASE_AUTH_DOMAIN: rent4fraction-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: rent4fraction-ci
          VITE_FIREBASE_STORAGE_BUCKET: rent4fraction-ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef123456
          VITE_API_BASE_URL: https://api.rent4fraction.test
          VITE_CLOUDINARY_CLOUD_NAME: rent4fraction-ci
          VITE_API_MODE: real
          VITE_USE_AUTH_EMULATOR: "false"

      - name: Production bundle audit
        run: node scripts/check-prod-bundle.mjs

  server:
    name: Server Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit bandit

      - name: Run unit tests
        run: pytest tests/unit
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          FIREBASE_PROJECT_ID: rent4fraction-ci
          FIREBASE_CREDENTIALS_JSON: '{"project_id":"rent4fraction-ci","client_email":"ci@rent4fraction-ci.iam.gserviceaccount.com","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDCIr...\n-----END PRIVATE KEY-----\n"}'
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-key
          CLOUDINARY_API_SECRET: ci-secret
          PAYMENTS_ONLINE_ENABLED: "false"
          ENV: dev
          DEBUG: "true"

      - name: Static security scan (Bandit)
        run: bandit -r app -ll -x app/tests

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt || true

