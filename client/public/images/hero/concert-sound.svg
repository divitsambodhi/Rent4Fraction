<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241116"/>
      <stop offset="45%" stop-color="#140B0D"/>
      <stop offset="100%" stop-color="#0B090A"/>
    </linearGradient>
    <radialGradient id="beamGlow1" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#E6B65C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#B65362" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#140B0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beamGlow2" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#B65362" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#762B36" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B090A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam1" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#E6B65C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E6B65C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#B65362" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B65362" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Atmospheric Background -->
  <rect width="1440" height="680" fill="url(#bgGrad)"/>
  <rect width="1440" height="680" fill="url(#beamGlow1)"/>
  <rect width="1440" height="680" fill="url(#beamGlow2)"/>

  <!-- Stage Light Beams -->
  <polygon points="450,-50 550,-50 900,680 150,680" fill="url(#beam1)"/>
  <polygon points="1050,-50 1150,-50 1350,680 700,680" fill="url(#beam2)"/>
  <polygon points="720,-50 780,-50 1100,680 400,680" fill="url(#beam1)" opacity="0.6"/>

  <!-- Hanging Line-Array Truss Rig Silhouettes (Right Side) -->
  <g transform="translate(1080, 40)" opacity="0.85">
    <!-- Top Truss -->
    <rect x="-80" y="0" width="220" height="12" rx="3" fill="#3D3638"/>
    <line x1="-70" y1="12" x2="130" y2="12" stroke="#252122" stroke-width="3"/>
    
    <!-- Curved Line-Array Modules -->
    <rect x="-20" y="25" width="100" height="42" rx="6" fill="#1C1819" stroke="#3D3638" stroke-width="2"/>
    <circle cx="30" cy="46" r="14" fill="#120F10" stroke="#762B36" stroke-width="1.5"/>
    
    <rect x="-16" y="74" width="98" height="42" rx="6" fill="#1C1819" stroke="#3D3638" stroke-width="2" transform="rotate(2, 33, 95)"/>
    <circle cx="33" cy="95" r="14" fill="#120F10" stroke="#762B36" stroke-width="1.5"/>
    
    <rect x="-10" y="123" width="96" height="42" rx="6" fill="#1C1819" stroke="#3D3638" stroke-width="2" transform="rotate(5, 38, 144)"/>
    <circle cx="38" cy="144" r="14" fill="#120F10" stroke="#762B36" stroke-width="1.5"/>

    <rect x="0" y="172" width="94" height="42" rx="6" fill="#1C1819" stroke="#3D3638" stroke-width="2" transform="rotate(9, 47, 193)"/>
    <circle cx="47" cy="193" r="14" fill="#120F10" stroke="#762B36" stroke-width="1.5"/>

    <rect x="14" y="221" width="92" height="42" rx="6" fill="#1C1819" stroke="#3D3638" stroke-width="2" transform="rotate(14, 60, 242)"/>
    <circle cx="60" cy="242" r="14" fill="#120F10" stroke="#762B36" stroke-width="1.5"/>
  </g>

  <!-- DJ Console Silhouette & Headphone Silhouette on Deck (Center Right) -->
  <g transform="translate(860, 360)" opacity="0.65">
    <ellipse cx="140" cy="140" rx="200" ry="25" fill="#140E10"/>
    <rect x="40" y="60" width="200" height="70" rx="8" fill="#1C1819" stroke="#332A2C" stroke-width="2"/>
    <circle cx="85" cy="95" r="24" fill="#2A2224" stroke="#762B36" stroke-width="1.5"/>
    <circle cx="195" cy="95" r="24" fill="#2A2224" stroke="#762B36" stroke-width="1.5"/>
    <!-- Jog lights -->
    <circle cx="85" cy="95" r="4" fill="#E6B65C"/>
    <circle cx="195" cy="95" r="4" fill="#E6B65C"/>
  </g>

  <!-- Atmospheric Dust & Bokeh Particles -->
  <circle cx="480" cy="240" r="3" fill="#E6B65C" opacity="0.6"/>
  <circle cx="580" cy="180" r="4" fill="#E6B65C" opacity="0.4"/>
  <circle cx="720" cy="310" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="890" cy="210" r="5" fill="#B65362" opacity="0.5"/>
  <circle cx="1020" cy="280" r="3" fill="#E6B65C" opacity="0.7"/>
  <circle cx="340" cy="420" r="2" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="650" cy="140" r="6" fill="#B65362" opacity="0.25"/>

  <!-- Lower Stage Silhouette Edge -->
  <path d="M0 580 Q400 550 800 590 T1440 560 V680 H0 Z" fill="#0B090A"/>
</svg>
