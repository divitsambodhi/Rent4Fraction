<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261614"/>
      <stop offset="50%" stop-color="#140C0B"/>
      <stop offset="100%" stop-color="#0B0808"/>
    </linearGradient>
    <radialGradient id="marqueeWarmGlow" cx="68%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E6B65C" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#762B36" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0808" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="680" fill="url(#bgGrad3)"/>
  <rect width="1440" height="680" fill="url(#marqueeWarmGlow)"/>

  <!-- High-Peak Pagoda Marquee Pavilion Silhouette (Right Center) -->
  <g transform="translate(900, 100)" opacity="0.8">
    <!-- Peak Top Finials -->
    <line x1="240" y1="20" x2="240" y2="70" stroke="#E6B65C" stroke-width="4"/>
    <circle cx="240" cy="18" r="8" fill="#E6B65C"/>

    <!-- High-Peak Canopy Slope -->
    <polygon points="240,70 60,260 420,260" fill="#251A18" stroke="#48332E" stroke-width="3"/>
    <polygon points="240,70 60,260 160,270 240,110" fill="#32221F" opacity="0.6"/>
    <!-- Scalloped Valance / Fringe in Brand Wine -->
    <path d="M60 260 L420 260 L420 275 L60 275 Z" fill="#762B36"/>

    <!-- Pavilion Support Columns -->
    <line x1="75" y1="275" x2="75" y2="480" stroke="#543F3B" stroke-width="8"/>
    <line x1="240" y1="275" x2="240" y2="480" stroke="#3D2B28" stroke-width="8"/>
    <line x1="405" y1="275" x2="405" y2="480" stroke="#543F3B" stroke-width="8"/>

    <!-- Warm Chandelier Inside Pavilion -->
    <circle cx="240" cy="310" r="14" fill="#E6B65C" opacity="0.8"/>
    <circle cx="240" cy="310" r="45" fill="#E6B65C" opacity="0.25" filter="blur(10px)"/>
    
    <!-- Velvet Banquet Chairs Silhouettes Inside -->
    <g transform="translate(100, 370)" opacity="0.9">
      <rect x="0" y="20" width="40" height="65" rx="6" fill="#762B36"/>
      <rect x="-4" y="55" width="48" height="15" rx="4" fill="#4D1922"/>
      <line x1="0" y1="70" x2="-2" y2="105" stroke="#E6B65C" stroke-width="3"/>
      <line x1="40" y1="70" x2="42" y2="105" stroke="#E6B65C" stroke-width="3"/>
    </g>
    <g transform="translate(170, 370)" opacity="0.9">
      <rect x="0" y="20" width="40" height="65" rx="6" fill="#762B36"/>
      <rect x="-4" y="55" width="48" height="15" rx="4" fill="#4D1922"/>
      <line x1="0" y1="70" x2="-2" y2="105" stroke="#E6B65C" stroke-width="3"/>
      <line x1="40" y1="70" x2="42" y2="105" stroke="#E6B65C" stroke-width="3"/>
    </g>
    <g transform="translate(240, 370)" opacity="0.9">
      <rect x="0" y="20" width="40" height="65" rx="6" fill="#762B36"/>
      <rect x="-4" y="55" width="48" height="15" rx="4" fill="#4D1922"/>
      <line x1="0" y1="70" x2="-2" y2="105" stroke="#E6B65C" stroke-width="3"/>
      <line x1="40" y1="70" x2="42" y2="105" stroke="#E6B65C" stroke-width="3"/>
    </g>
  </g>

  <!-- Ambient Fairy Light Swags between trees/poles -->
  <path d="M500 240 Q700 320 900 260" stroke="#E6B65C" stroke-width="1.5" stroke-dasharray="3 7" fill="none" opacity="0.5"/>
  <path d="M720 190 Q1050 300 1380 210" stroke="#E6B65C" stroke-width="1.5" stroke-dasharray="3 7" fill="none" opacity="0.4"/>
</svg>
