    <line x1="124" y1="5" x2="124" y2="265" stroke="#762B36" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ground Rig / Stand -->
  <rect x="130" y="365" width="340" height="12" rx="4" fill="#1A1718"/>
