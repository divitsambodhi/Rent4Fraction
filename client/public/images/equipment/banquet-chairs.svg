<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <rect width="600" height="450" fill="#F4F1EA"/>
  <rect x="20" y="20" width="560" height="410" rx="16" fill="#EDE8DF"/>
  <circle cx="300" cy="225" r="160" fill="#762B36" fill-opacity="0.04"/>

  <!-- Banquet Chairs Array -->
  <!-- Chair 1 (Left Back) -->
  <g transform="translate(140, 110)">
    <!-- Backrest Frame -->
    <path d="M20 180V60C20 30 70 30 70 60V180" stroke="#C59B51" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="45" width="42" height="75" rx="8" fill="#762B36"/>
    <!-- Seat Cushion -->
    <rect x="15" y="145" width="60" height="18" rx="5" fill="#762B36" stroke="#C59B51" stroke-width="2"/>
    <!-- Legs -->
    <line x1="20" y1="163" x2="16" y2="245" stroke="#C59B51" stroke-width="4"/>
    <line x1="70" y1="163" x2="74" y2="245" stroke="#C59B51" stroke-width="4"/>
  </g>

  <!-- Chair 2 (Center Front - Hero) -->
  <g transform="translate(250, 85)">
    <!-- Backrest Frame -->
    <path d="M25 210V70C25 35 85 35 85 70V210" stroke="#C59B51" stroke-width="5" stroke-linecap="round"/>
    <rect x="30" y="55" width="50" height="90" rx="10" fill="#762B36"/>
    <!-- Seat Cushion -->
    <rect x="18" y="165" width="74" height="22" rx="6" fill="#762B36" stroke="#C59B51" stroke-width="3"/>
    <!-- Legs -->
    <line x1="25" y1="187" x2="20" y2="280" stroke="#C59B51" stroke-width="5" stroke-linecap="round"/>
    <line x1="85" y1="187" x2="90" y2="280" stroke="#C59B51" stroke-width="5" stroke-linecap="round"/>
    <!-- Stretcher -->
    <line x1="22" y1="230" x2="88" y2="230" stroke="#C59B51" stroke-width="3"/>
  </g>

  <!-- Chair 3 (Right Back) -->
  <g transform="translate(370, 110)">
    <!-- Backrest Frame -->
    <path d="M20 180V60C20 30 70 30 70 60V180" stroke="#C59B51" stroke-width="4" stroke-linecap="round"/>
    <rect x="24" y="45" width="42" height="75" rx="8" fill="#762B36"/>
    <!-- Seat Cushion -->
    <rect x="15" y="145" width="60" height="18" rx="5" fill="#762B36" stroke="#C59B51" stroke-width="2"/>
    <!-- Legs -->
    <line x1="20" y1="163" x2="16" y2="245" stroke="#C59B51" stroke-width="4"/>
    <line x1="70" y1="163" x2="74" y2="245" stroke="#C59B51" stroke-width="4"/>
  </g>

  <text x="300" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#762B36" letter-spacing="1.5">ROYAL BANQUET CHAIRS (SET OF 50)</text>
</svg>
