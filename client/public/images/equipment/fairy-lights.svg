<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <rect width="600" height="450" fill="#F4F1EA"/>
  <rect x="20" y="20" width="560" height="410" rx="16" fill="#EDE8DF"/>
  <circle cx="300" cy="225" r="160" fill="#762B36" fill-opacity="0.04"/>

  <!-- Top Support Bar -->
  <line x1="100" y1="80" x2="500" y2="80" stroke="#762B36" stroke-width="4" stroke-linecap="round"/>

  <!-- Cascading Curtain Lines with Bulbs -->
  <g stroke="#9E8D7F" stroke-width="1.5" stroke-dasharray="2 6">
    <line x1="130" y1="80" x2="130" y2="340"/>
    <line x1="180" y1="80" x2="180" y2="350"/>
    <line x1="230" y1="80" x2="230" y2="330"/>
    <line x1="280" y1="80" x2="280" y2="360"/>
    <line x1="330" y1="80" x2="330" y2="355"/>
    <line x1="380" y1="80" x2="380" y2="340"/>
    <line x1="430" y1="80" x2="430" y2="350"/>
    <line x1="480" y1="80" x2="480" y2="330"/>
  </g>

  <!-- Glowing Warm Bulbs -->
  <!-- Col 1 -->
  <circle cx="130" cy="120" r="5" fill="#E6B65C"/><circle cx="130" cy="120" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="130" cy="180" r="5" fill="#E6B65C"/><circle cx="130" cy="180" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="130" cy="240" r="5" fill="#E6B65C"/><circle cx="130" cy="240" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="130" cy="300" r="5" fill="#E6B65C"/><circle cx="130" cy="300" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 2 -->
  <circle cx="180" cy="140" r="5" fill="#E6B65C"/><circle cx="180" cy="140" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="180" cy="210" r="5" fill="#E6B65C"/><circle cx="180" cy="210" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="180" cy="280" r="5" fill="#E6B65C"/><circle cx="180" cy="280" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 3 -->
  <circle cx="230" cy="110" r="5" fill="#E6B65C"/><circle cx="230" cy="110" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="230" cy="170" r="5" fill="#E6B65C"/><circle cx="230" cy="170" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="230" cy="250" r="5" fill="#E6B65C"/><circle cx="230" cy="250" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 4 -->
  <circle cx="280" cy="130" r="5" fill="#E6B65C"/><circle cx="280" cy="130" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="280" cy="200" r="5" fill="#E6B65C"/><circle cx="280" cy="200" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="280" cy="270" r="5" fill="#E6B65C"/><circle cx="280" cy="270" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="280" cy="330" r="5" fill="#E6B65C"/><circle cx="280" cy="330" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 5 -->
  <circle cx="330" cy="150" r="5" fill="#E6B65C"/><circle cx="330" cy="150" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="330" cy="220" r="5" fill="#E6B65C"/><circle cx="330" cy="220" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="330" cy="290" r="5" fill="#E6B65C"/><circle cx="330" cy="290" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 6 -->
  <circle cx="380" cy="120" r="5" fill="#E6B65C"/><circle cx="380" cy="120" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="380" cy="190" r="5" fill="#E6B65C"/><circle cx="380" cy="190" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="380" cy="260" r="5" fill="#E6B65C"/><circle cx="380" cy="260" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <!-- Col 7 & 8 -->
  <circle cx="430" cy="140" r="5" fill="#E6B65C"/><circle cx="430" cy="140" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="430" cy="220" r="5" fill="#E6B65C"/><circle cx="430" cy="220" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="480" cy="130" r="5" fill="#E6B65C"/><circle cx="480" cy="130" r="10" fill="#E6B65C" fill-opacity="0.3"/>
  <circle cx="480" cy="250" r="5" fill="#E6B65C"/><circle cx="480" cy="250" r="10" fill="#E6B65C" fill-opacity="0.3"/>

  <text x="300" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#762B36" letter-spacing="1.5">WARM WHITE FAIRY LIGHT CURTAIN (3x3M)</text>
</svg>
