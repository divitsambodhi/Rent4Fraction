<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <rect width="600" height="450" fill="#F4F1EA"/>
  <rect x="20" y="20" width="560" height="410" rx="16" fill="#EDE8DF"/>
  <circle cx="300" cy="225" r="160" fill="#762B36" fill-opacity="0.04"/>

  <!-- Receiver Unit -->
  <rect x="110" y="290" width="380" height="70" rx="8" fill="#252122" stroke="#3D3638" stroke-width="3"/>
  <line x1="140" y1="290" x2="110" y2="210" stroke="#762B36" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="290" x2="490" y2="210" stroke="#762B36" stroke-width="4" stroke-linecap="round"/>
  <!-- Channels LCDs -->
  <rect x="150" y="305" width="60" height="30" rx="4" fill="#141213" stroke="#762B36" stroke-width="1.5"/>
  <rect x="230" y="305" width="60" height="30" rx="4" fill="#141213" stroke="#762B36" stroke-width="1.5"/>
  <rect x="310" y="305" width="60" height="30" rx="4" fill="#141213" stroke="#762B36" stroke-width="1.5"/>
  <rect x="390" y="305" width="60" height="30" rx="4" fill="#141213" stroke="#762B36" stroke-width="1.5"/>

  <!-- 4 Wireless Microphones Standing / Floating -->
  <g transform="translate(160, 95)">
    <rect x="10" y="50" width="16" height="120" rx="6" fill="#3D3638"/>
    <circle cx="18" cy="35" r="18" fill="#762B36" stroke="#4D1922" stroke-width="2"/>
    <rect x="13" y="150" width="10" height="15" fill="#141213"/>
  </g>
  <g transform="translate(240, 75)">
    <rect x="10" y="50" width="16" height="120" rx="6" fill="#3D3638"/>
    <circle cx="18" cy="35" r="18" fill="#762B36" stroke="#4D1922" stroke-width="2"/>
    <rect x="13" y="150" width="10" height="15" fill="#141213"/>
  </g>
  <g transform="translate(320, 75)">
    <rect x="10" y="50" width="16" height="120" rx="6" fill="#3D3638"/>
    <circle cx="18" cy="35" r="18" fill="#762B36" stroke="#4D1922" stroke-width="2"/>
    <rect x="13" y="150" width="10" height="15" fill="#141213"/>
  </g>
  <g transform="translate(400, 95)">
    <rect x="10" y="50" width="16" height="120" rx="6" fill="#3D3638"/>
    <circle cx="18" cy="35" r="18" fill="#762B36" stroke="#4D1922" stroke-width="2"/>
    <rect x="13" y="150" width="10" height="15" fill="#141213"/>
  </g>

  <text x="300" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#762B36" letter-spacing="1.5">UHF 4-CHANNEL MIC SET</text>
</svg>
