<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <rect width="600" height="450" fill="#F4F1EA"/>
  <rect x="20" y="20" width="560" height="410" rx="16" fill="#EDE8DF"/>
  <circle cx="300" cy="225" r="160" fill="#762B36" fill-opacity="0.04"/>

  <!-- Pagoda Canopy Structure -->
  <!-- Peak Finial -->
  <circle cx="300" cy="85" r="7" fill="#C59B51"/>
  <line x1="300" y1="85" x2="300" y2="105" stroke="#C59B51" stroke-width="4"/>

  <!-- High-Peak Roof -->
  <path d="M300 105L160 210L300 230L440 210L300 105Z" fill="#FFFFFF" stroke="#D5CEC5" stroke-width="2"/>
  <path d="M300 105L160 210V225L300 245V105Z" fill="#F0ECE4" stroke="#D5CEC5" stroke-width="2"/>
  <path d="M300 105L440 210V225L300 245V105Z" fill="#FAF8F5" stroke="#D5CEC5" stroke-width="2"/>
  
  <!-- Scalloped Valance / Border Trim in Brand Color -->
  <path d="M160 225L300 245L440 225L440 235L300 255L160 235Z" fill="#762B36"/>

  <!-- Aluminum Support Corner Columns -->
  <line x1="165" y1="230" x2="165" y2="350" stroke="#7A7476" stroke-width="6" stroke-linecap="round"/>
  <line x1="298" y1="250" x2="298" y2="370" stroke="#484345" stroke-width="7" stroke-linecap="round"/>
  <line x1="435" y1="230" x2="435" y2="350" stroke="#7A7476" stroke-width="6" stroke-linecap="round"/>

  <!-- Interior Ambient Glow -->
  <polygon points="175,235 425,235 410,350 190,350" fill="#762B36" fill-opacity="0.05"/>

  <!-- Foot Base Plates -->
  <rect x="150" y="348" width="30" height="6" rx="2" fill="#3D3638"/>
  <rect x="283" y="368" width="30" height="6" rx="2" fill="#252122"/>
  <rect x="420" y="348" width="30" height="6" rx="2" fill="#3D3638"/>

  <text x="300" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#762B36" letter-spacing="1.5">10x10 FT PAGODA CANOPY MARQUEE</text>
</svg>
