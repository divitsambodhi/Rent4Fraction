  </g>

  <text x="300" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#762B36" letter-spacing="1.5">HIGH-TOP COCKTAIL TABLES (SET OF 10)</text>
