<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#232428" />
    <meta name="color-scheme" content="light dark" />
    <title>Rent4Fraction | Event Equipment Rental Marketplace</title>
    <meta
      name="description"
      content="Rent sound, stage lighting, furniture, and canopies from verified vendors across India. Unified bookings, transparent pricing, and safe deposits."
    />
    <meta name="theme-color" content="#FFFFFF" id="theme-meta" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('r4f_theme') || localStorage.getItem('r4f-theme');
          var theme = saved;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.getElementById('theme-meta');
            if (meta) meta.setAttribute('content', '#232428');
          } else {
            document.documentElement.removeAttribute('data-theme');
            var meta = document.getElementById('theme-meta');
            if (meta) meta.setAttribute('content', '#FFFFFF');
          }
        } catch (e) {
          /* fallback */
        }
      })();
    </script>
  </head>
  <body class="min-h-dvh bg-background text-foreground antialiased selection:bg-brand selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
